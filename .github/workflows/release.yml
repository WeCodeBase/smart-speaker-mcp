name: Release

# Triggered by pushing a tag like v3.2.0 (semver, with leading "v")
# Cross-compiles smart-speaker-mcp for 5 OS/arch targets and attaches
# the binaries + a SHA256SUMS file to a GitHub Release.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # needed by softprops/action-gh-release to create the release

jobs:
  build-and-release:
    name: Cross-compile and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Verify dependencies
        run: |
          go mod download
          go vet ./...

      - name: Compute version string
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build all platforms
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/WeCodeBase/smart-speaker-mcp/internal/mcpserver.Version=${VERSION}"
          build() {
            local goos="$1" goarch="$2" ext="$3"
            local out="dist/smart-speaker-mcp-${goos}-${goarch}${ext}"
            echo "▶ Building $out"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="$LDFLAGS" -o "$out" ./cmd/smart-speaker-mcp
          }
          build darwin   arm64 ""
          build darwin   amd64 ""
          build windows  amd64 ".exe"
          build linux    amd64 ""
          build linux    arm64 ""

      - name: Generate SHA256 checksums
        working-directory: dist
        run: sha256sum smart-speaker-mcp-* > SHA256SUMS.txt

      - name: List artefacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/smart-speaker-mcp-darwin-arm64
            dist/smart-speaker-mcp-darwin-amd64
            dist/smart-speaker-mcp-windows-amd64.exe
            dist/smart-speaker-mcp-linux-amd64
            dist/smart-speaker-mcp-linux-arm64
            dist/SHA256SUMS.txt
